<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Monitor</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1c1c1a;--mut:#6b6b66;--bd:#e2e2dc;--up:#1a7f4b;--dn:#c0392b;--wa:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#1f1f1d;--tx:#eeeeea;--mut:#9a9a92;--bd:#33332f;--up:#4cc38a;--dn:#ff7b6b;--wa:#e5b25d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;max-width:1000px;margin-inline:auto}
h1{font-size:20px;margin:0 0 4px}.s{color:var(--mut);font-size:13px;margin:0 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
nav a{flex:1;text-align:center;padding:8px 4px;border:1px solid var(--bd);border-radius:8px;color:var(--tx);text-decoration:none;font-weight:600;font-size:14px}
nav a.on{background:var(--tx);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.up{color:var(--up)}.dn{color:var(--dn)}.wa{color:var(--wa)}.mu{color:var(--mut)}
.desc{color:var(--mut);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:10px 0}
.m small{display:block;color:var(--mut);font-size:11px}.m b{font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cards .card{margin:0}
svg{width:100%;height:46px;display:block}
.al{padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:baseline}
.al:last-child{border:0}.new{font-size:11px;font-weight:700;color:var(--bg);background:var(--dn);padding:1px 6px;border-radius:99px}
.leg{font-size:11px;color:var(--mut);margin-top:4px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bd);margin-top:6px}.bar i{display:block;height:100%}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:960px;font-size:13px}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th:last-child,td:last-child{text-align:left}
input[type=text]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button,label.btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-weight:600;margin:6px 6px 0 0}
textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
</style></head><body>
<h1>Market Monitor</h1><p class="s" id="upd"></p>
<nav id="nav"></nav>
<div id="v"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
const TABS=["Home","ETFs","Macro","India","Holdings"];
const f=(x,d=1,u="%")=>x==null?"—":(x>0?"+":"")+x.toFixed(d)+u;
const cl=x=>x==null?"mu":x>0?"up":x<0?"dn":"mu";
let M={},I={},H=[],W="",A={},hmsg="",who="All";
const get=u=>fetch(u+"?"+Date.now()).then(r=>r.json()).catch(()=>null);
function spark(a,color){
 if(!a||a.length<2)return"";
 const lo=Math.min(...a),hi=Math.max(...a),r=(hi-lo)||1;
 const p=a.map((v,i)=>(i/(a.length-1)*100).toFixed(1)+","+(44-(v-lo)/r*40).toFixed(1)).join(" ");
 return `<svg viewBox="0 0 100 46" preserveAspectRatio="none" role="img"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function card(x){
 const y=x.isYield,u=y?" pts":"%",d=y?2:1;
 const col=cl(x.m1)==="up"?"var(--up)":cl(x.m1)==="dn"?"var(--dn)":"var(--mut)";
 const dma=x.vsDma==null?"—":x.vsDma>=0?"Above":"Below";
 return `<div class="card"><div class="top"><b>${x.name}</b><b>${x.last.toLocaleString(undefined,{maximumFractionDigits:y?2:2})}${y?"%":""}</b></div>
 ${x.desc?`<div class="desc">${x.desc}</div>`:""}
 ${x.stale?'<div class="wa" style="font-size:12px">Stale: last price '+x.asOf+'</div>':""}
 ${spark(x.spark,col)}
 <div class="grid"><div class="m"><small>1 day</small><b class="${cl(x.d1)}">${f(x.d1,d,u)}</b></div>
 <div class="m"><small>1 week</small><b class="${cl(x.d5)}">${f(x.d5,d,u)}</b></div>
 <div class="m"><small>1 month</small><b class="${cl(x.m1)}">${f(x.m1,d,u)}</b></div>
 <div class="m"><small>1 year</small><b class="${cl(x.y1)}">${f(x.y1,d,u)}</b></div>
 <div class="m"><small>2 years</small><b class="${cl(x.y2)}">${f(x.y2,d,u)}</b></div>
 <div class="m"><small>5 years</small><b class="${cl(x.y5)}">${f(x.y5,d,u)}</b></div>
 ${y?"":`<div class="m"><small>From 1Y high</small><b class="${cl(x.fromHigh)}">${f(x.fromHigh)}</b></div>
 <div class="m"><small>200-day avg</small><b class="${cl(x.vsDma)}">${dma}</b></div>`}</div></div>`;
}
function home(){
 const a=M.alerts||[],act=a.filter(x=>!x.cleared),old=a.filter(x=>x.cleared);
 const row=x=>`<div class="al"><span>${x.new?'<span class="new">NEW</span> ':""}${x.text}</span><span class="mu" style="margin-left:auto;font-size:12px">${x.date.slice(5)}</span></div>`;
 const err=(M.errors||[]);
 return `<div class="card"><b>Needs attention (${act.length})</b>${act.length?act.map(row).join(""):'<div class="mu">Nothing unusual right now.</div>'}</div>
 ${old.length?`<div class="card"><b>Cleared this week</b>${old.map(row).join("")}</div>`:""}
 <div class="card"><b>Data health</b>${err.length?err.map(e=>`<div class="wa" style="font-size:13px">${e}</div>`).join(""):'<div class="up">All sources loaded.</div>'}</div>`;
}
function etfs(){return `<div class="cards">${(M.etfs||[]).map(card).join("")}</div>`}
function macro(){
 let h="";
 if(M.fed)h+=`<div class="card"><b>Fed target rate</b><div class="grid"><div class="m"><small>Range</small><b>${M.fed.lower}–${M.fed.upper}%</b></div>
 <div class="m"><small>Last change</small><b>${M.fed.lastChange?M.fed.lastChange.date+" ("+M.fed.lastChange.from+"→"+M.fed.lastChange.to+")":"none in 60 days"}</b></div></div></div>`;
 if(M.ratio)h+=`<div class="card"><div class="top"><b>Gold / silver ratio</b><b>${M.ratio.ratio}</b></div>${spark(M.ratio.spark,"var(--wa)")}<div class="leg">10-year percentile: ${M.ratio.pct} (high = ...)</div></div>`;
 return h+`<div class="cards">${(M.macro||[]).map(card).join("")}</div>`;
}
function india(){
 if(!I.indices)return '<div class="card mu">data.json not found.</div>';
 return `<p class="s">As of ${I.asOf} · exact values from NSE daily index files</p><div class="cards">`+I.indices.map(r=>{
  const c=/Attractive|Cheap, earnings growth|High growth/.test(r.label)?"up":/risk|Over|Expensive|falling/.test(r.label)?"dn":"wa";
  const a=Math.abs(r.epsGrowth||0),b=Math.abs(r.peChange||0),s=(a+b)||1;
  return `<div class="card"><div class="top"><b>${r.name}</b><span class="tag ${c}">${r.label}</span></div>
  <div class="grid"><div class="m"><small>Price 1Y</small><b class="${cl(r.priceChange)}">${f(r.priceChange)}</b></div>
  <div class="m"><small>EPS growth</small><b class="${cl(r.epsGrowth)}">${f(r.epsGrowth)}</b></div>
  <div class="m"><small>PE change</small><b class="${cl(r.peChange)}">${f(r.peChange)}</b></div>
  <div class="m"><small>PE now</small><b>${r.pe}</b></div><div class="m"><small>PE 1Y ago</small><b>${r.peAgo}</b></div>
  <div class="m"><small>PE pctile 5Y</small><b>${r.pePercentile==null?"—":Math.round(r.pePercentile)}</b></div></div>
  <div class="bar"><i style="width:${a/s*100}%;background:${r.epsGrowth>=0?"var(--up)":"var(--dn)"}"></i><i style="width:${b/s*100}%;background:${r.peChange>=0?"var(--wa)":"var(--mut)"}"></i></div>
  <div class="leg">Left: EPS effect · Right: PE effect</div></div>`}).join("")+"</div>";
}

const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const inr=x=>x==null?"—":"₹"+Math.round(x).toLocaleString("en-IN");
const num=v=>{const n=parseFloat(String(v??"").replace(/[,₹\s]/g,""));return isNaN(n)?null:n};
const isGold=s=>/GOLD|SILV|^SGB/i.test(s);
const isMF=s=>/DIRECT|GROWTH|FUND|MF|PLAN|INDEX FUND/i.test(s);
const sum=a=>a.reduce((s,x)=>s+x,0);
const owners=()=>[...new Set(H.map(h=>h.owner))];
const normSym=s=>String(s??"").trim().toUpperCase().replace(/-(BE|BZ|T0|X1|XT|Z|IL|SM)$/,"" );

function csvRows(t){
 const rows=[];let r=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;
  else if(ch===","){r.push(c);c=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}
  else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}
 return rows;
}
function parseHoldings(rows){
 const norm=s=>String(s??"").toLowerCase().replace(/[^a-z]/g,"");
 const hi=rows.findIndex(r=>r.some(c=>["symbol","instrument","stock","company","scrip","name"].includes(norm(c))));
 if(hi<0)throw new Error("no Symbol or Instrument column found");
 const h=rows[hi].map(norm);
 const col=(...n)=>{for(const k of n){const i=h.findIndex(x=>x.startsWith(k));if(i>=0)return i}return -1};
 const cS=col("symbol","instrument","stock","company","scrip","name"),cQ=col("quantityavailable","qty","quantity"),
 cA=col("averageprice","buyavg","avgcost","avgprice","averagecost","avg"),cL=col("previousclosingprice","ltp","closeprice","prevclose","closing","currentprice","price");
 if(cQ<0||cA<0||cL<0)throw new Error("quantity, average price or closing price column not found (headers seen: "+rows[hi].join(" | ")+")");
 const out=[];
 for(const r of rows.slice(hi+1)){
  const raw=String(r[cS]??"").trim(),qty=num(r[cQ]),avg=num(r[cA]),ltp=num(r[cL]);
  if(!raw||qty==null||avg==null||ltp==null||qty<=0||/^total$/i.test(raw))continue;
  out.push({sym:normSym(raw),qty,avg,ltp});
 }
 if(!out.length)throw new Error("no holdings rows found");
 return out;
}
function normalizeNumber(v){
 if(v==null||v==="")return null;
 if(typeof v==="number")return Number.isFinite(v)?v:null;
 if(typeof v==="string"){
  const cleaned=v.replace(/[^0-9.\-]/g,"");
  if(!cleaned||cleaned==="-"||cleaned===".")return null;
  const n=Number(cleaned);
  return Number.isFinite(n)?n:null;
 }
 return null;
}
function normalizeSymbol(v){
 return String(v ?? "").trim().replace(/\s+/g," ").toUpperCase().replace(/-(BE|BZ|T0|X1|XT|Z|IL|SM)$/i,"");
}
function parseJsonHoldings(data){
 const rows=[];
 function walk(node){
  if(!node||typeof node!=="object")return;
  if(Array.isArray(node)){
   for(const item of node)walk(item);
   return;
  }
  if(Array.isArray(node.eq))for(const item of node.eq)rows.push({...item,__type:"eq"});
  if(Array.isArray(node.mf))for(const item of node.mf)rows.push({...item,__type:"mf"});
  if(Array.isArray(node.holdings))for(const item of node.holdings)rows.push({...item,__type:"eq"});
  for(const key of ["eq","mf","holdings","data","result","payload"]) {
   if(node[key]&&typeof node[key]==="object")walk(node[key]);
  }
 }
 walk(data);
 if(!rows.length)throw new Error("JSON file does not contain a holdings array");
 const out=[];
 for(const row of rows){
  const type=row.__type || (row.isin_breakdown && typeof row.isin_breakdown === "object" ? "mf" : "eq");
  const sym=normalizeSymbol(row.tradingsymbol || row.symbol || row.instrument || row.stock || row.company || row.scrip || row.name || row.fundName || row.mfName);
  const qty=normalizeNumber(row.quantity_available ?? row.quantity ?? row.total_quantity ?? row.qty ?? row.quantity_long_term ?? row.quantity_t1 ?? row.units ?? row.qtyAvailable ?? row.quantityAvailable);
  const avg=normalizeNumber(row.buy_average ?? row.average_price ?? row.avgprice ?? row.averagecost ?? row.avg ?? row.avg_price ?? row.buyAvg ?? row.purchasePrice);
  const ltp=normalizeNumber(row.ltp ?? row.close_price ?? row.current_price ?? row.price ?? row.last_price ?? row.closing_price ?? row.closingPrice ?? row.nav ?? row.netAssetValue ?? row.currentValue);
  if(!sym||qty==null||avg==null||ltp==null||qty<=0)continue;
  out.push({
   sym,
   qty:Number(qty),
   avg:Number(avg),
   ltp:Number(ltp),
   type,
   isMutualFund:type==="mf",
   sector:row.sector || "",
   cap:row.cap || "",
   weight:normalizeNumber(row.weight),
   unrealizedProfit:normalizeNumber(row.unrealized_profit),
   closingValue:normalizeNumber(row.closing_value),
   instrumentType:row.instrument_type || "",
   isin:row.isin || "",
   holdingsDate:row.holdings_date || "",
   mfHoldings:row.isin_breakdown && typeof row.isin_breakdown === "object" ? row.isin_breakdown : {}
  });
 }
 if(!out.length)throw new Error("No valid holdings found in the JSON file");
 return out;
}
function save(owner,list){
 H=H.filter(h=>h.owner!==owner).concat(list.map(x=>({...x,owner})));
 A={};lsSet("mm_holdings2",H);lsSet("mm_analysis",A);who="All";
 hmsg=`Saved ${list.length} holdings for ${owner}.`;
}
const ownerName=()=>(document.getElementById("hown").value.trim()||"Me");
async function importFile(file){
 const owner=ownerName();
 try{
  let sheets=[];
  if(/\.json$/i.test(file.name)){
   const parsed=parseJsonHoldings(JSON.parse(await file.text()));
   save(owner,parsed);
   show();
   return;
  }
  if(/\.csv$/i.test(file.name))sheets=[csvRows(await file.text())];
  else{
   if(typeof XLSX==="undefined")throw new Error("Excel reader did not load. Save the file as CSV or JSON and import that");
   const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
   const names=[...wb.SheetNames].sort((a,b)=>(/equity|holding/i.test(b)?1:0)-(/equity|holding/i.test(a)?1:0));
   sheets=names.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""}));
  }
  let res=null,err=null;
  for(const s of sheets){try{res=parseHoldings(s);break}catch(e){err=e}}
  if(!res)throw err;
  save(owner,res);
 }catch(e){hmsg="Import failed: "+e.message}
 show();
}
function fixPaste(t){
 const lines=t.split(/\r?\n/).map(l=>l.replace(/\s+$/,"")) .filter(l=>l.trim()),rows=[];let sym=null;
 const isNum=s=>/^[\d,\.\-+%₹\s]+$/.test(s);
 rows.push(lines[0].split("\t").map(s=>s.trim()));
 for(const l of lines.slice(1)){
  if(l.includes("\t")){const f=l.split("\t").map(s=>s.trim());if(sym!=null){rows.push([sym,...f]);sym=null}else if(!isNum(f[0]))rows.push(f)}
  else if(sym==null&&!isNum(l.trim()))sym=l.trim().split(/\s+/)[0];
 }
 return rows;
}
function importPaste(){
 const owner=ownerName(),t=document.getElementById("hpaste").value;
 try{save(owner,parseHoldings(t.includes("\t")?fixPaste(t):csvRows(t)))}
 catch(e){hmsg="Paste failed: "+e.message}
 show();
}
function metrics(r){
 if(!r||r.last==null)return{basis:"",price1y:null,dma:null,pe:null,epsG:null,peChg:null,label:"No data"};
 const qd=(r.q||[]),q=qd.map(x=>x[1]),a=(r.a||[]).map(x=>x[1]);
 const contig=qd.length>=8&&qd.slice(-8).every((x,i,z)=>i===0||(new Date(x[0])-new Date(z[i-1][0]))/864e5<110);
 let now=null,ago=null,basis="";
 if(contig){now=sum(q.slice(-4));ago=sum(q.slice(-8,-4));basis="TTM"}
 else if(a.length>=2){now=a[a.length-1];ago=a[a.length-2];basis="FY"}
 const m={basis,price1y:r.ago?(r.last/r.ago-1)*100:null,dma:r.dma?(r.last/r.dma-1)*100:null,last:r.last,conv:!!r.conv};
 m.loss=now!=null&&now<=0;
 m.pe=now>0?r.last/now:null;m.eps=now;m.bad=m.pe!=null&&m.pe>150;
 m.epsG=now!=null&&ago>0?(now/ago-1)*100:null;
 m.peAgo=ago>0&&r.ago?r.ago/ago:null;
 m.peChg=m.pe!=null&&m.peAgo!=null?(m.pe/m.peAgo-1)*100:null;
 m.label=m.loss?"Loss-making":m.epsG==null?"No earnings data":m.epsG<0&&m.peChg>0?"High risk / Overvalued":m.epsG<0?"Earnings falling":m.epsG>=15?"High growth":"Fair / Stagnant";
 return m;
}
async function analyse(){
 if(!W){hmsg="Paste your Worker address first.";return show()}
 const raw={},eq=[...new Set(H.map(h=>h.sym))].filter(s=>!isGold(s)&&!isMF(s));
 for(let i=0;i<eq.length;i+=15){
  hmsg=`Analysing ${Math.min(i+15,eq.length)} of ${eq.length}…`;show();
  try{
   const r=await fetch(W+(W.includes("?")?"&":"?")+"s="+encodeURIComponent(eq.slice(i,i+15).join(",")));
   if(!r.ok)throw new Error("HTTP "+r.status);
   Object.assign(raw,await r.json());
  }catch(e){hmsg="Worker error: "+e.message;return show()}
 }
 A={at:new Date().toISOString().slice(0,16).replace("T"," ")};
 for(const s of eq)A[s]=metrics(raw[s]);
 lsSet("mm_analysis",A);hmsg="Analysis done.";show();
}
function holdings(){
 let h=`<div class="card"><b>Import holdings</b>
 <p class="s">Zerodha Console: Portfolio → Holdings → download. Supports equity, mutual funds, and ETFs. You can import JSON, CSV, or XLSX files, or paste the table.</p>
 <input type="text" id="hown" placeholder="Owner name (e.g. Me, Wife, Father)" value="${who!=="All"?who:""}">
 <label class="btn">Choose file<input type="file" id="hf" accept=".xlsx,.xls,.csv,.json" hidden></label>
 <p class="s" style="margin-top:12px">Or paste a holdings table here:</p>
 <textarea id="hpaste" rows="3" placeholder="Paste CSV / Zerodha table here"></textarea>
 <button id="hpb">Import pasted table</button>
 <div class="mu" style="font-size:13px;margin-top:8px">${hmsg}</div></div>`;
 h+=`<div class="card"><b>Worker address</b><p class="s">Needed for PE and EPS growth. Your Cloudflare Worker's web address.</p>
 <input type="text" id="hw" placeholder="https://something.workers.dev" value="${W}"><button id="hws">Save</button></div>`;
 if(!H.length)return h;
 const os=owners();
 h+=`<div class="card"><b>Whose holdings</b><div>${["All",...os].map(o=>`<button class="hwho" data-o="${o}" style="${o===who?"background:var(--tx);color:var(--bg)":""}">${o}</button>`).join("")}</div>
 <div style="margin-top:6px">${who!=="All"?`<button id="hrm">Remove ${who}</button>`:""}<button id="hclear">Clear everything</button></div></div>`;
 const by={};
 for(const x of H.filter(x=>who==="All"||x.owner===who)){
  const r=by[x.sym]||(by[x.sym]={sym:x.sym,qty:0,inv:0,val:0,ltp:x.ltp,isMF:x.isMutualFund,mfName:x.isMutualFund?x.sym:null});
  r.qty+=x.qty;r.inv+=x.qty*x.avg;r.val+=x.qty*x.ltp;r.ltp=x.ltp;
 }
 const rows=Object.values(by).map(r=>({...r,m:A[r.sym]||null})).sort((a,b)=>b.val-a.val);
 const tv=sum(rows.map(r=>r.val)),ti=sum(rows.map(r=>r.inv)),pl=tv-ti;
 const gold=rows.filter(r=>isGold(r.sym)),gv=sum(gold.map(r=>r.val)),ev=tv-gv;
 const mfs=rows.filter(r=>r.isMF),mfv=sum(mfs.map(r=>r.val));
 const equities=rows.filter(r=>!isGold(r.sym)&&!r.isMF),eqv=sum(equities.map(r=>r.val));
 const got=rows.filter(r=>r.m&&!isGold(r.sym)&&!r.isMF),peRows=got.filter(r=>r.m.pe>0&&!r.m.bad);
 const cov=eqv?sum(peRows.map(r=>r.val))/eqv*100:0;
 const pPE=peRows.length?sum(peRows.map(r=>r.val))/sum(peRows.map(r=>r.val/r.m.pe)):null;
 const share=f=>eqv?sum(got.filter(f).map(r=>r.val))/eqv*100:0;
 const top5=tv?sum(rows.slice(0,5).map(r=>r.val))/tv*100:0;
 h+=`<div class="card"><b>Portfolio${who!=="All"?" · "+who:os.length>1?" · all":""}</b><div class="grid">
 <div class="m"><small>Invested</small><b>${inr(ti)}</b></div><div class="m"><small>Value</small><b>${inr(tv)}</b></div>
 <div class="m"><small>P&L</small><b class="${cl(pl)}">${inr(pl)} (${f(ti?pl/ti*100:null)})</b></div>
 <div class="m"><small>Holdings</small><b>${rows.length}</b></div><div class="m"><small>Top 5 weight</small><b>${top5.toFixed(0)}%</b></div>
 <div class="m"><small>Gold &amp; silver</small><b>${tv?(gv/tv*100).toFixed(0):0}%</b></div>
 <div class="m"><small>Mutual funds</small><b>${tv?(mfv/tv*100).toFixed(0):0}%</b></div>
 <div class="m"><small>Equities</small><b>${tv?(eqv/tv*100).toFixed(0):0}%</b></div></div>`;
 if(got.length)h+=`<div class="grid"><div class="m"><small>Equity PE</small><b>${pPE==null?"—":pPE.toFixed(1)}</b></div>
 <div class="m"><small>PE coverage</small><b>${cov.toFixed(0)}%</b></div>
 <div class="m"><small>High growth</small><b class="up">${share(r=>r.m.label==="High growth").toFixed(0)}%</b></div>
 <div class="m"><small>Earnings falling</small><b class="dn">${share(r=>/falling|risk/.test(r.m.label)).toFixed(0)}%</b></div>
 <div class="m"><small>Below 200-day</small><b>${share(r=>r.m.dma<0).toFixed(0)}%</b></div></div>
 <div class="leg">Equity figures cover the non-gold/silver part only. Equity PE = value-weighted (total value ÷ total earnings) over holdings with positive earnings. Analysis from ${A.at}. Missing data is shown as "—".</div>`;
 h+=`<button id="han">${Object.keys(A).length>1?"Refresh analysis":"Analyse PE and EPS growth"}</button></div>`;
 h+=`<div class="card"><div class="wrap"><table><tr><th>Stock/Fund</th><th>Qty</th><th>Avg</th><th>LTP</th><th>Value</th><th>P&L</th><th>Weight</th><th>Type</th><th>PE</th><th>EPS gr.</th><th>PE chg</th><th>Price 1Y</th><th>vs 200d</th><th>Label</th></tr>`+
 rows.map(r=>{const m=r.m,c=!m?"mu":/Attractive|growth/.test(m.label)?"up":/risk|falling|Loss/.test(m.label)?"dn":"wa";
  const peCell=m&&m.pe!=null?(m.bad?"n/a ⚠":m.pe.toFixed(1)):"—";
  const epsCell=m&&m.epsG!=null?f(m.epsG)+(m.basis==="FY"?" FY":""):"—";
  const peChgCell=m&&m.peChg!=null?f(m.peChg):"—";
  const p1yCell=m&&m.price1y!=null?f(m.price1y):"—";
  const dmaCell=m&&m.dma!=null?f(m.dma):"—";
  const typeLabel=r.isMF?"MF":(isGold(r.sym)?"Gold":"Equity");
  return `<tr><td><b>${r.sym}</b></td><td>${r.qty}</td><td>${inr(r.inv/r.qty)}</td><td>${inr(r.ltp)}</td><td>${inr(r.val)}</td><td class="${cl(r.val-r.inv)}">${inr(r.val-r.inv)}</td><td>${(r.val/tv*100).toFixed(1)}%</td><td><span class="tag mu">${typeLabel}</span></td><td>${peCell}</td><td class="${cl(m&&m.epsG)}">${epsCell}</td><td class="${cl(m&&m.peChg)}">${peChgCell}</td><td class="${cl(m&&m.price1y)}">${p1yCell}</td><td class="${cl(m&&m.dma)}">${dmaCell}</td><td class="${isGold(r.sym)?"mu":c}">${isGold(r.sym)?"Gold / silver":r.isMF?"Mutual Fund":m?m.label:"—"}</td></tr>`;}).join("")+
 `</table></div><div class="leg">Quantity = "Quantity Available" from the file. Price = current LTP. MF = Mutual Fund. Compare totals with your broker. EPS growth and PE change use trailing 4 quarters vs the 4 before. Missing data is shown as "—".</div>`;
 return h;
}
function bindHoldings(){
 const $=id=>document.getElementById(id);
 $("hf").onchange=e=>e.target.files[0]&&importFile(e.target.files[0]);
 $("hpb").onclick=importPaste;
 $("hws").onclick=()=>{W=$("hw").value.trim().replace(/\/+$/,"" );lsSet("mm_worker",W);hmsg="Saved.";show();};
 if($("han"))$("han").onclick=analyse;
 if($("hclear"))$("hclear").onclick=()=>{H=[];A={};who="All";lsSet("mm_holdings2",H);lsSet("mm_analysis",A);hmsg="Cleared.";show();};
 if($("hrm"))$("hrm").onclick=()=>{H=H.filter(h=>h.owner!==who);who="All";lsSet("mm_holdings2",H);hmsg="Removed.";show();};
 document.querySelectorAll(".hwho").forEach(b=>b.onclick=()=>{who=b.dataset.o;show()});
}

 document.getElementById("nav").innerHTML=TABS.map(n=>`<a href="#${n.toLowerCase()}" class="${n.toLowerCase()===t?"on":""}">${n}</a>`).join("");
 document.getElementById("v").innerHTML={home,etfs,macro,india,holdings}[t]?.()||home();
 if(t==="holdings")bindHoldings();
}
const lsData={get:ls.get, set:lsSet};
H=lsData.get("mm_holdings2")||[];W=lsData.get("mm_worker")||"";A=lsData.get("mm_analysis")||{};
Promise.all([get("markets.json"),get("data.json")]).then(([m,i])=>{
 M=m||{errors:["markets.json not found yet. Run the Update markets workflow."]};I=i||{};
 document.getElementById("upd").textContent=M.updated?"Markets updated "+M.updated.replace("T"," ").replace("+00:00","")+" UTC":"";
 show();
});
