name: Update data
on:
  schedule:
    - cron: "30 12 * * 1-5"   # weekdays 18:00 IST
  workflow_dispatch:           # lets you run it by hand
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch.py
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update data" && git pull --rebase && git push)
