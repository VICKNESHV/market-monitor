name: Update markets
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python markets.py
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add markets.json state.json
          git diff --staged --quiet || (git commit -m "Update markets" && git pull --rebase && git push)
